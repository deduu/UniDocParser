[tool.poetry]
name = "unidocparser"
version = "0.1.0"
description = "UniDocParser backend"
authors = ["deduu <dedy.ariansyah1@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
pydantic = ">=2.10.6,<3.0.0"
pdf2image = ">=1.17.0,<2.0.0"
numpy = ">=2.1.0,<3.0.0"
ultralytics = ">=8.3.96,<9.0.0"
supervision = ">=0.25.1,<0.26.0"
python-dotenv = ">=1.0.1,<2.0.0"
fastapi = ">=0.115.12,<0.116.0"
uvicorn = ">=0.34.0,<0.35.0"
pydantic-settings = ">=2.8.1,<3.0.0"
python-multipart = ">=0.0.20,<0.0.21"

bitsandbytes = ">=0.46.0,<0.47.0"
pytest = ">=8.4.1,<9.0.0"
peft = ">=0.17.0,<0.18.0"
ocrmypdf = ">=16.10.4,<17.0.0"
markdownify = ">=1.2.0,<2.0.0"
langchain = ">=0.3.27,<0.4.0"
unstructured = { version = ">=0.18.13,<0.19.0", extras = ["all-docs"] }
celery = ">=5.5.3,<6.0.0"
redis = ">=6.4.0,<7.0.0"
asyncpg = ">=0.30.0,<0.31.0"
psycopg2-binary = ">=2.9.10,<3.0.0"
openpyxl = ">=3.1.0,<4.0.0"
excel2img = { version = ">=1.4.0,<2.0.0", markers = "sys_platform == 'win32'" }
transformers = "==4.51.3"
unsloth = { git = "https://github.com/unslothai/unsloth.git"}
unsloth-zoo ="==2025.5.8"
torch = "==2.8.0"



[tool.poetry.group.dev.dependencies]
uvicorn = "^0.34.3"
toml = "^0.10.2"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
